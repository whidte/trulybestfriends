plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${mod_version}-${minecraft_version}"
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                file('src/generated/resources/').absolutePath, '--existing',
                file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.theillusivec4.top' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// ModDev 会用主主机注入这些仓库。请改用 NeoForge 的
// 官方 CDN，因为某些网络环境下无法访问主主机。
repositories.named('NeoForged Releases') {
    url = uri('https://neoforged.forgecdn.net/releases')
}
repositories.named('Mojang Meta') {
    url = uri('https://neoforged.forgecdn.net/mojang-meta')
}

dependencies {
    compileOnly 'dev.ftb.mods:ftb-teams-neoforge:2101.1.2'
    compileOnly files(
        'libs/l2tabs-3.0.5+7.jar',
        'libs/l2core-3.0.8+15.jar',
        'libs/l2serial-3.1.1.jar',
        'libs/Registrate-MC1.21-1.3.0+67.jar'
    )
    if (!providers.gradleProperty('skipOptionalRuntime').isPresent()) {
        runtimeOnly 'maven.modrinth:l2library:3.0.8'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range, mod_id: mod_id,
        mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('configDimensionSmokeTest', JavaExec) {
    group = 'verification'
    description = '运行独立的维度名称冒烟测试。'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.ConfigDimensionTest'
}

tasks.register('entityTypeListMatcherSmokeTest', JavaExec) {
    group = 'verification'
    description = '验证实体类型名单的精确匹配与命名空间通配匹配。'
