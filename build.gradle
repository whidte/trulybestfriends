plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Mojang official mappings keep the source identical to the Forge branch.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // FTB Teams and L2Tabs are optional soft dependencies.
    modCompileOnly "dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}"
    modCompileOnly files('libs/l2tabs-0.3.3.jar')
}

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
    runs {
        // 固定开发环境用户名：Minecraft 会在无 --uuid 参数时按用户名派生离线 UUID
        // （"OfflinePlayer:Dev" 的 MD5），从而保证 run/saves 下的
        // trulybestfriends/{ownerUuid} 存储目录与 pets_index.nbt 索引跨会话稳定。
        client {
            programArgs "--username", "Dev"
        }
    }
}

repositories {
    // Put repositories for dependencies here
    // Loom automatically adds the Fabric maven and Maven Central for you

    maven { url = "https://maven.ftb.dev/releases" }
    maven { url = "https://maven.architectury.dev/" }

    flatDir {
        dir 'libs'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            loader_version: loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register('petPersistenceSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Validates legacy horse-slot migration and atomic NBT replacement.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.network.PetPersistenceSmokeTest'
}

tasks.register('multipartRotationSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Validates that multipart pitch remains view-space invariant across yaw angles.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.tab.MultipartRotationSmokeTest'
}

tasks.register('petGuiNbtSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Validates one-pet full-NBT sync and passenger-tree filtering.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.network.PetGuiNbtSmokeTest'
}

tasks.register('petListFilterSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Validates combined species and pet-name filtering.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.tab.PetListFilterSmokeTest'
}

tasks.register('reviveProtectionSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Validates the exact 20-tick post-revive protection window.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.ReviveProtectionSmokeTest'
}

tasks.named('check') {
    dependsOn tasks.named('ownerNbtResolverSmokeTest')
    dependsOn tasks.named('petPersistenceSmokeTest')
    dependsOn tasks.named('multipartRotationSmokeTest')
    dependsOn tasks.named('petGuiNbtSmokeTest')
    dependsOn tasks.named('petListFilterSmokeTest')
    dependsOn tasks.named('reviveProtectionSmokeTest')
    dependsOn tasks.named('petIndexBlacklistTest')
    dependsOn tasks.named('petHealingSmokeTest')
    dependsOn tasks.named('petTeamDataTest')
}

tasks.register('ownerNbtResolverSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Validates top-level and nested owner NBT path resolution.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.OwnerNbtResolverSmokeTest'
}

tasks.register('petHealingSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Validates pet healing duration, pulse, cap, and pending-state rules.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.network.PetHealingSmokeTest'
}

tasks.register('petIndexBlacklistTest', JavaExec) {
    group = 'verification'
    description = 'Validates persistent UUID blacklist entries in the pet index.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.PetIndexBlacklistTest'
}

tasks.register('petTeamDataTest', JavaExec) {
    group = 'verification'
    description = 'Validates the eight-team NBT schema, slots, capacity, and stale-member cleanup.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whidte.trulybestfriends.network.PetTeamDataTest'
}

// Clean stale lock files from previous runClient before launching
tasks.register('cleanRunLocks') {
    doLast {
        def runDir = file('run')
        if (runDir.exists()) {
            fileTree(runDir).matching {
                include '**/session.lock'
                include '**/*.lock'
            }.each { it.delete() }
        }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'cleanRunLocks'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
